server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 静态资源长缓存（Vite 产物带内容哈希）
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # SPA history 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
